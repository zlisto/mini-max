    <style>
      html, body { margin: 0; height: 100%; background: #0b0614; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      .touch #game { right: 52px; right: calc(52px + env(safe-area-inset-right)); }
      #rotate { display: none; position: fixed; inset: 0; z-index: 40; background: #0b0614; color: #ffd166; font: 800 20px Nunito, sans-serif; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; }
      #rotate .phone { width: 54px; height: 92px; border: 5px solid #ff5fa2; border-radius: 12px; animation: turn 1.8s ease-in-out infinite; }
      @keyframes turn { 0%, 20% { transform: rotate(0) } 55%, 100% { transform: rotate(-90deg) } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      /* keep the fonts warm so Phaser can measure them */
      .fontwarm { position: absolute; left: -999px; font-family: Bangers; }
      .fontwarm2 { position: absolute; left: -999px; font-family: Nunito; font-weight: 800; }
    </style>

    <div class="fontwarm">.</div><div class="fontwarm2">.</div>
